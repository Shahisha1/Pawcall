name: Build and publish Pawcall

on:
  release:
    types: [published]
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (for example 1.1.0)
        required: true
        type: string
      changelog:
        description: Changelog for the CurseForge file
        required: true
        type: string
      release_type:
        description: CurseForge release channel
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: write

concurrency:
  group: curseforge-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_BODY: ${{ github.event.release.body }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" && -n "$EVENT_TAG" ]]; then
            VERSION="${EVENT_TAG#v}"
            CHANGELOG="$EVENT_BODY"
            RELEASE_TYPE="release"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
            CHANGELOG="See CHANGELOG.md for details."
            RELEASE_TYPE="release"
          else
            VERSION="$INPUT_VERSION"
            CHANGELOG="$INPUT_CHANGELOG"
            RELEASE_TYPE="$INPUT_RELEASE_TYPE"
          fi

          if [[ -z "$VERSION" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.2.3-beta.1" >&2
            exit 1
          fi

          case "$RELEASE_TYPE" in
            release|beta|alpha) ;;
            *) echo "Invalid release type: $RELEASE_TYPE" >&2; exit 1 ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          {
            echo 'changelog<<PAWCALL_CHANGELOG'
            printf '%s\n' "${CHANGELOG:-Pawcall $VERSION release.}"
            echo 'PAWCALL_CHANGELOG'
          } >> "$GITHUB_OUTPUT"

      - name: Build mod
        run: ./gradlew --no-daemon clean build -Pversion=${{ steps.release.outputs.version }}

      - name: Locate distributable JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'pawcall-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          if [[ -z "$JAR" ]]; then
            echo "No distributable Pawcall JAR found in build/libs." >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Built: $JAR"

      - name: Attach JAR to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
        run: gh release upload "$TAG" "$JAR_PATH" --clobber

      - name: Upload JAR to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_CORE_API_KEY: ${{ secrets.CURSEFORGE_CORE_API_KEY || '' }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || '1774134' }}
          CURSEFORGE_MINECRAFT_VERSION_ID: ${{ vars.CURSEFORGE_MINECRAFT_VERSION_ID || '' }}
          CURSEFORGE_FABRIC_VERSION_ID: ${{ vars.CURSEFORGE_FABRIC_VERSION_ID || '' }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TYPE: ${{ steps.release.outputs.release_type }}
          CHANGELOG: ${{ steps.release.outputs.changelog }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "Missing CURSEFORGE_API_TOKEN. Add it in GitHub: Settings > Secrets and variables > Actions > New repository secret." >&2
            exit 1
          fi

          MINECRAFT_VERSION_ID="${CURSEFORGE_MINECRAFT_VERSION_ID:-}"
          FABRIC_VERSION_ID="${CURSEFORGE_FABRIC_VERSION_ID:-}"
          LOOKUP_KEY="${CURSEFORGE_CORE_API_KEY:-$CURSEFORGE_API_TOKEN}"

          if [[ -z "$MINECRAFT_VERSION_ID" || -z "$FABRIC_VERSION_ID" ]]; then
            echo "Resolving CurseForge game version IDs for Minecraft 26.3 / Fabric..."

            resolve_ids() {
              local json="$1"
              local mc fab
              # Core API v2 shape: { data: [ { versions: [ { name, id } ] } ] }
              mc="$(jq -er --arg version "26.3" '[.data[]?.versions[]? | select(.name == $version) | .id] | first // empty' <<< "$json" 2>/dev/null || true)"
              fab="$(jq -er '[.data[]?.versions[]? | select(.name == "Fabric") | .id] | first // empty' <<< "$json" 2>/dev/null || true)"
              # Legacy upload API shape: [ { name, id, ... } ]
              if [[ -z "$mc" ]]; then
                mc="$(jq -er --arg version "26.3" '[.[]? | select(.name == $version) | .id] | first // empty' <<< "$json" 2>/dev/null || true)"
              fi
              if [[ -z "$fab" ]]; then
                fab="$(jq -er '[.[]? | select(.name == "Fabric" or .slug == "fabric") | .id] | first // empty' <<< "$json" 2>/dev/null || true)"
              fi
              printf '%s|%s' "$mc" "$fab"
            }

            GAME_VERSIONS=""
            ids=""
            # Try Core API v2 (works with Core API key)
            for auth_header in "x-api-key: $LOOKUP_KEY" "X-Api-Token: $LOOKUP_KEY"; do
              if GAME_VERSIONS="$(curl -fsS -H "$auth_header" "https://api.curseforge.com/v2/games/432/versions" 2>/dev/null)"; then
                ids="$(resolve_ids "$GAME_VERSIONS")"
                MINECRAFT_VERSION_ID="${ids%%|*}"
                FABRIC_VERSION_ID="${ids#*|}"
                [[ -n "$MINECRAFT_VERSION_ID" && -n "$FABRIC_VERSION_ID" ]] && break
              fi
              GAME_VERSIONS=""
              MINECRAFT_VERSION_ID=""
              FABRIC_VERSION_ID=""
            done

            # Fallback: legacy game versions endpoint (often works with project upload token)
            if [[ -z "$MINECRAFT_VERSION_ID" || -z "$FABRIC_VERSION_ID" ]]; then
              echo "Core API lookup unavailable; trying legacy game versions endpoint..."
              if GAME_VERSIONS="$(curl -fsS -H "X-Api-Token: $CURSEFORGE_API_TOKEN" "https://minecraft.curseforge.com/api/game/versions" 2>/dev/null)"; then
                ids="$(resolve_ids "$GAME_VERSIONS")"
                MINECRAFT_VERSION_ID="${ids%%|*}"
                FABRIC_VERSION_ID="${ids#*|}"
              fi
            fi

            if [[ -z "$MINECRAFT_VERSION_ID" || -z "$FABRIC_VERSION_ID" ]]; then
              echo "Could not resolve CurseForge game version IDs." >&2
              echo "Options:" >&2
              echo "  1) Add repository variables (Actions > Variables) with numeric IDs:" >&2
              echo "     CURSEFORGE_MINECRAFT_VERSION_ID = numeric ID for Minecraft 26.3" >&2
              echo "     CURSEFORGE_FABRIC_VERSION_ID   = numeric ID for Fabric" >&2
              echo "  2) Add a CurseForge Core API key (https://console.curseforge.com/) as secret CURSEFORGE_CORE_API_KEY for automatic lookup." >&2
              exit 1
            fi
          fi

          if [[ -z "$MINECRAFT_VERSION_ID" || -z "$FABRIC_VERSION_ID" ]]; then
            echo "Failed to determine CurseForge version IDs (Minecraft='$MINECRAFT_VERSION_ID', Fabric='$FABRIC_VERSION_ID')." >&2
            exit 1
          fi

          jq -n \
            --arg displayName "Pawcall $VERSION - Minecraft 26.3 Fabric" \
            --arg changelog "$CHANGELOG" \
            --arg releaseType "$RELEASE_TYPE" \
            --argjson minecraftVersionId "$MINECRAFT_VERSION_ID" \
            --argjson fabricVersionId "$FABRIC_VERSION_ID" \
            '{
              displayName: $displayName,
              changelog: $changelog,
              changelogType: "markdown",
              releaseType: $releaseType,
              gameVersions: [$minecraftVersionId, $fabricVersionId],
              isMarkedForManualRelease: false
            }' > curseforge-metadata.json

          echo "Uploading $JAR_PATH to CurseForge project $CURSEFORGE_PROJECT_ID (MC=$MINECRAFT_VERSION_ID, Fabric=$FABRIC_VERSION_ID)..."
          curl --fail-with-body --show-error --silent \
            -H "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            -F "metadata=$(cat curseforge-metadata.json)" \
            -F "file=@$JAR_PATH" \
            "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file"

          echo "CurseForge upload completed for Pawcall $VERSION."

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawcall-${{ steps.release.outputs.version }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
