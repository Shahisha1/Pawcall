name: Build and publish Pawcall

on:
  release:
    types: [published]
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (for example 1.1.0)
        required: true
        type: string
      changelog:
        description: Changelog for the CurseForge file
        required: true
        type: string
      release_type:
        description: CurseForge release channel
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: write

concurrency:
  group: curseforge-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_BODY: ${{ github.event.release.body }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" && -n "$EVENT_TAG" ]]; then
            VERSION="${EVENT_TAG#v}"
            CHANGELOG="$EVENT_BODY"
            RELEASE_TYPE="release"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
            CHANGELOG="See CHANGELOG.md for details."
            RELEASE_TYPE="release"
          else
            VERSION="$INPUT_VERSION"
            CHANGELOG="$INPUT_CHANGELOG"
            RELEASE_TYPE="$INPUT_RELEASE_TYPE"
          fi

          if [[ -z "$VERSION" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.2.3-beta.1" >&2
            exit 1
          fi

          case "$RELEASE_TYPE" in
            release|beta|alpha) ;;
            *) echo "Invalid release type: $RELEASE_TYPE" >&2; exit 1 ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          {
            echo 'changelog<<PAWCALL_CHANGELOG'
            printf '%s\n' "${CHANGELOG:-Pawcall $VERSION release.}"
            echo 'PAWCALL_CHANGELOG'
          } >> "$GITHUB_OUTPUT"

      - name: Build mod
        run: ./gradlew --no-daemon clean build -Pversion=${{ steps.release.outputs.version }}

      - name: Locate distributable JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'pawcall-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          if [[ -z "$JAR" ]]; then
            echo "No distributable Pawcall JAR found in build/libs." >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Built: $JAR"

      - name: Attach JAR to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
        run: gh release upload "$TAG" "$JAR_PATH" --clobber

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3.1.2
        with:
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID || '1774134' }}
          game_endpoint: minecraft
          file_path: ${{ steps.jar.outputs.path }}
          display_name: Pawcall ${{ steps.release.outputs.version }} - Minecraft 26.3 Fabric
          changelog: ${{ steps.release.outputs.changelog }}
          changelog_type: markdown
          release_type: ${{ steps.release.outputs.release_type }}
          # Override with Actions variable CURSEFORGE_GAME_VERSIONS if CurseForge requires different labels.
          game_versions: ${{ vars.CURSEFORGE_GAME_VERSIONS || 'Minecraft 26.3,Fabric,Java 25,Client,Server' }}

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawcall-${{ steps.release.outputs.version }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
